<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Señor Busca</title>
<meta name="theme-color" content="#F1E8D2">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'none'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/libre-caslon-text-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="estilo.css">
<link rel="stylesheet" href="impresion.css" media="print">
<script type="module" src="app.js"></script>
</head>
<body>
<main id="app">

  <section class="pantalla" id="p-portada" data-pantalla="portada" hidden>
    <div class="portada">
      <h1 data-t="pantalla_1_portada.titulo"></h1>
      <p class="subtitulo" data-t="pantalla_1_portada.subtitulo"></p>
      <a class="boton" href="#elegir" data-t="pantalla_1_portada.boton"></a>
    </div>
    <p class="creditos" data-t="creditos"></p>
  </section>

  <section class="pantalla" id="p-elegir" data-pantalla="elegir" hidden>
    <h2 data-t="pantalla_2_elegir.titulo"></h2>
    <ul class="tarjetas" id="tarjetas"></ul>
    <a class="enlace volver" href="#portada" data-t="pantalla_2b_aviso_lanyon.botones.1"></a>
  </section>

  <section class="pantalla" id="p-aviso" data-pantalla="aviso" hidden>
    <p class="aviso-lanyon" data-t="pantalla_2b_aviso_lanyon.texto"></p>
    <div class="botones">
      <a class="boton" href="#carta-lanyon" data-t="pantalla_2b_aviso_lanyon.botones.0"></a>
      <a class="boton boton-sec" href="#elegir" data-t="pantalla_2b_aviso_lanyon.botones.1"></a>
    </div>
  </section>

  <section class="pantalla" id="p-carta" data-pantalla="carta" hidden>
    <div class="aviso-fijo" id="aviso-fijo" role="note" hidden></div>
    <blockquote class="ancla">
      <p id="ancla-texto"></p>
      <cite id="ancla-fuente"></cite>
    </blockquote>
    <div class="guia" id="guia">
      <p class="eco" id="eco"></p>
      <p class="pregunta" id="pregunta" aria-live="polite"></p>
    </div>
    <div class="enlaces-guia">
      <button type="button" class="enlace" id="otra-pregunta" data-t="pantalla_3_carta.enlaces.0"></button>
      <button type="button" class="enlace" id="ocultar-preguntas" data-t="pantalla_3_carta.enlaces.1"></button>
    </div>
    <textarea id="papel" class="papel" spellcheck="true" autocapitalize="sentences"></textarea>
    <div class="botones">
      <a class="boton" id="ir-cerrar" href="#cerrar" data-t="pantalla_4_cerrar.pasos.0"></a>
      <a class="enlace volver" href="#elegir" data-t="pantalla_2b_aviso_lanyon.botones.1"></a>
    </div>
  </section>

  <section class="pantalla" id="p-cerrar" data-pantalla="cerrar" hidden>
    <fieldset class="paso">
      <legend data-t="pantalla_4_cerrar.pasos.0"></legend>
      <div class="opciones" id="opciones-papel"></div>
    </fieldset>
    <fieldset class="paso">
      <legend data-t="pantalla_4_cerrar.pasos.1"></legend>
      <div class="opciones" id="opciones-sello"></div>
    </fieldset>
    <div class="paso">
      <label for="firma" class="legend" data-t="pantalla_4_cerrar.pasos.2"></label>
      <input id="firma" class="firma-campo" type="text" autocomplete="off" autocapitalize="words" spellcheck="false">
    </div>

    <article class="carta-final" id="carta-final">
      <div class="carta-cuerpo" id="carta-cuerpo"></div>
      <div class="carta-pie">
        <span class="carta-sello" id="carta-sello" aria-hidden="true"></span>
        <span class="carta-firma" id="carta-firma"></span>
      </div>
    </article>

    <p class="texto-cierre" data-t="pantalla_4_cerrar.texto"></p>
    <div class="botones">
      <button type="button" class="boton" id="enviar" data-t="pantalla_4_cerrar.botones.0"></button>
      <button type="button" class="boton boton-sec" id="imprimir" data-t="pantalla_4_cerrar.botones.1"></button>
      <button type="button" class="boton boton-sec" id="guardar" data-t="pantalla_4_cerrar.botones.2"></button>
    </div>
    <p class="linea-final" id="linea-final"></p>
    <p class="nota-tecnica" data-t="pantalla_4_cerrar.nota_tecnica"></p>
    <a class="enlace volver" id="volver-carta" href="#carta" data-t="pantalla_2b_aviso_lanyon.botones.1"></a>
  </section>

</main>

<div class="aviso-guardado" id="aviso-guardado" role="status" aria-live="polite"></div>

<footer class="pie" id="pie"></footer>
</body>
</html>
